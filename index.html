<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waypoint — Route Viewer</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <p class="eyebrow">Track log 001</p>
      <h1>Waypoint</h1>
      <p>Overlay GPX tracks on the map. Saved routes load automatically — drop in your own file to preview it instantly.</p>
    </div>

    <div class="section">
      <h2>Saved routes</h2>
      <ul class="route-list" id="route-list">
        <li class="empty-note">Loading routes…</li>
      </ul>
    </div>

    <div class="section">
      <h2>Load a GPX file</h2>
      <label class="dropzone" id="dropzone" for="file-input">
        Drop a .gpx file here, or click to browse
        <input type="file" id="file-input" accept=".gpx" multiple />
      </label>
    </div>

    <div class="instrument">
      <div>LAT <span id="cur-lat">—</span></div>
      <div>LON <span id="cur-lon">—</span></div>
    </div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
